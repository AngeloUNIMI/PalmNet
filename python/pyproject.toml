[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "palmnet-pca-gabor-pytorch"
version = "1.0.0"
description = "Conversion of the supplied PCA-Gabor palmprint feature-extraction pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.26", "scipy>=1.11", "Pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
palmnet-pca-gabor = "palmnet.cli:main"

[tool.setuptools.packages.find]
include = ["palmnet*"]
